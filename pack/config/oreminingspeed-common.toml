#Mining speed multipliers. 1.0 keeps default speed.
[mining]
	#Configure block speed multipliers in one list.
	#Use exact IDs ("minecraft:deepslate=2.0") or wildcard IDs ("minecraft:*_ore=0.8").
	#Rules are applied top-to-bottom; later matching rules override earlier ones.
	block_multipliers = ["minecraft:deepslate=2.0", "minecraft:tuff=2.0"]
